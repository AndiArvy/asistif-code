<!DOCTYPE html>
<html>

<head>
    <title>Asistif Tunanetra WebRTC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            touch-action: none;
        }

        h3 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .top-panel {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        #localVideo {
            width: 120px;
            height: 160px;
            background: #000;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .controls {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            flex: 1;
        }

        .controls button {
            background: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 14px 10px;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
        }

        .controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #micStatus {
            text-align: center;
            font-weight: bold;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #333;
            color: #ffeb3b;
        }

        #micStatus.active {
            color: #00e676;
        }

        #chatLog {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            touch-action: auto;
        }

        .user-msg {
            color: #4da6ff;
            margin-bottom: 8px;
        }

        .ai-msg {
            color: #00e676;
            margin-bottom: 8px;
        }

        .system-msg {
            color: #ffeb3b;
            font-style: italic;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <h3>Sistem Asistif Aktif</h3>

    <div class="top-panel">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="controls">
            <button id="switchCameraBtn" type="button">Ganti Kamera</button>
            <button id="torchBtn" type="button">Flashlight: OFF</button>
            <div id="micStatus">🎤 Mic: MATI</div>
        </div>
    </div>

    <audio id="remoteAudio" autoplay></audio>

    <div id="chatLog">
        <div class="system-msg">[Sistem]: Menunggu koneksi...</div>
    </div>

    <script>
        let pc = null;
        let localStream = null;
        let audioSender = null;
        let videoSender = null;
        let currentFacingMode = "environment";
        let torchEnabled = false;
        let isTtsPlaying = false;
        let isHolding = false;
        let hasUserInteracted = false;
        let useWebSpeech = false;
        const defaultTtsPlaybackRate = 1.2;

        const ttsPlayer = new Audio();

        ttsPlayer.onended = () => {
            isTtsPlaying = false;
        };

        ttsPlayer.onerror = () => {
            isTtsPlaying = false;
        };

        // --- Vibration feedback (haptic) ---
        function vibrate(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        // --- Web Speech API (Offline TTS via browser native) ---
        function isSpeechSynthesisSupported() {
            return 'speechSynthesis' in window;
        }

        function speakOffline(text, lang = 'id-ID') {
            if (!isSpeechSynthesisSupported()) {
                console.warn("Web Speech API tidak didukung browser ini.");
                return false;
            }

            // Cancel previous speech to avoid overlapping
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            utterance.onstart = () => {
                isTtsPlaying = true;
            };

            utterance.onend = () => {
                isTtsPlaying = false;
            };

            utterance.onerror = (e) => {
                console.error("Web Speech error:", e);
                isTtsPlaying = false;
            };

            window.speechSynthesis.speak(utterance);
            return true;
        }

        // Mark user interaction to unlock audio/autoplay policies
        function markUserInteraction() {
            if (!hasUserInteracted) {
                hasUserInteracted = true;
                // Test speech synthesis availability (Chrome needs a user gesture first)
                if (isSpeechSynthesisSupported()) {
                    // Speak a silent test to warm up the engine
                    const testUtterance = new SpeechSynthesisUtterance('');
                    testUtterance.volume = 0;
                    window.speechSynthesis.speak(testUtterance);
                }
                // Warm up the Audio element too
                ttsPlayer.load();
            }
        }

        const chatLog = document.getElementById('chatLog');
        const localVideo = document.getElementById('localVideo');
        const switchCameraBtn = document.getElementById('switchCameraBtn');
        const torchBtn = document.getElementById('torchBtn');
        const micUI = document.getElementById('micStatus');

        function setMicEnabled(enabled) {
            if (!localStream) return;
            const micTrack = localStream.getAudioTracks()[0];
            if (micTrack) micTrack.enabled = enabled;
        }

        function addLog(sender, text, className) {
            const div = document.createElement('div');
            div.className = className;
            div.innerText = `[${sender}]: ${text}`;
            chatLog.appendChild(div);
            chatLog.scrollTo({
                top: chatLog.scrollHeight,
                behavior: "smooth"
            });
        }

        let holdSafetyTimer = null;

        function startHolding(pointerId) {
            if (isHolding) return;
            isHolding = true;

            vibrate(100);

            if (isTtsPlaying) {
                if (useWebSpeech && isSpeechSynthesisSupported()) {
                    window.speechSynthesis.cancel();
                } else {
                    ttsPlayer.pause();
                }
                isTtsPlaying = false;
            }

            setMicEnabled(true);

            if (wsFrontend.readyState === WebSocket.OPEN) {
                wsFrontend.send(JSON.stringify({type: "hold_action", action: "start_listening"}));
            }

            micUI.innerText = "🎤 Mic: AKTIF";
            micUI.classList.add("active");

            // Safety: auto-stop setelah 30 detik jika pointerup tidak pernah sampai
            clearTimeout(holdSafetyTimer);
            holdSafetyTimer = setTimeout(() => {
                if (isHolding) stopHolding();
            }, 30000);
        }

        function stopHolding() {
            clearTimeout(holdSafetyTimer);
            if (!isHolding) return;
            isHolding = false;

            vibrate([30, 30, 30]);

            setMicEnabled(false);

            if (wsFrontend.readyState === WebSocket.OPEN) {
                wsFrontend.send(JSON.stringify({type: "hold_action", action: "stop_listening"}));
            }

            micUI.innerText = "🎤 Mic: MATI";
            micUI.classList.remove("active");
        }

        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${wsProtocol}//${window.location.host}/frontend_ws`;
        const wsFrontend = new WebSocket(wsUrl);

        wsFrontend.onopen = function () {
            // If Web Speech API is available, tell server to send text-only TTS
            if (isSpeechSynthesisSupported()) {
            // if (0) {
                useWebSpeech = true;
                wsFrontend.send(JSON.stringify({
                    type: "capability",
                    tts_mode: "webspeech"
                }));
                addLog("Sistem", "Mode TTS offline (Web Speech API) aktif.", "system-msg");
            } else {
                addLog("Sistem", "Web Speech API tidak tersedia, fallback ke TTS server (gTTS).", "system-msg");
            }
        };

        wsFrontend.onmessage = function (event) {
            const data = JSON.parse(event.data);

            if (data.type === "speak") {
                // Web Speech API TTS - text only, no base64 audio
                if (isTtsPlaying) {
                    window.speechSynthesis.cancel();
                    isTtsPlaying = false;
                }

                const spoken = speakOffline(data.text, data.lang || 'id-ID');
                if (!spoken) {
                    // Fallback: request audio from server if Web Speech fails
                    addLog("Sistem", "Web Speech gagal, fallback ke audio server.", "system-msg");
                }
                if (data.text) {
                    addLog("Sistem AI", data.text, "ai-msg");
                    const t = data.text.toLowerCase();
                    if (t.includes("itu tombolnya") || t.includes("tombol yang tepat")) {
                        vibrate([100, 50, 100]);
                    } else if (t.includes("hilang") || t.includes("terlalu jauh") || t.includes("tidak terlihat") || t.includes("belum terlihat") || t.includes("terpotong")) {
                        vibrate(400);
                    }
                }
            }
            else if (data.type === "audio") {
                if (isTtsPlaying) {
                    if (useWebSpeech) {
                        window.speechSynthesis.cancel();
                    } else {
                        ttsPlayer.pause();
                    }
                    isTtsPlaying = false;
                }

                isTtsPlaying = true;

                ttsPlayer.src = "data:audio/mp3;base64," + data.audio;
                const rate = Number(data.playback_rate);
                ttsPlayer.playbackRate = Number.isFinite(rate) && rate > 0 ? rate : defaultTtsPlaybackRate;

                ttsPlayer.play().catch((err) => {
                    if (err.name !== "AbortError") {
                        addLog("Error", "Gagal memutar audio: " + err.message, "system-msg");
                    }
                    isTtsPlaying = false;
                });

                if (data.text) addLog("Sistem AI", data.text, "ai-msg");
            }
            else if (data.type === "log") {
                if (data.sender === "Control") {
                    if (data.text === "TOGGLE_FLASH") {
                        toggleTorch();
                    }
                    return;
                }
                addLog(data.sender, data.text, data.sender === "User" ? "user-msg" : "system-msg");
            }
        };

        function updateTorchButtonState() {
            torchBtn.innerText = `Flashlight: ${torchEnabled ? "ON" : "OFF"}`;
        }

        function getAudioConstraints() {
            return {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            };
        }

        function getHighVideoConstraints(facingMode) {
            return {
                facingMode,
                width: { ideal: 1920 },
                height: { ideal: 1080 },
                frameRate: { min: 5, ideal: 10 }
            };
        }

        function getFallbackVideoConstraints(facingMode) {
            return {
                facingMode,
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            };
        }

        function logVideoSettings(track, contextLabel) {
            if (!track || typeof track.getSettings !== "function") return;
            const settings = track.getSettings();
            const width = settings.width || "?";
            const height = settings.height || "?";
            const fps = settings.frameRate || "?";
            addLog("Sistem", `${contextLabel}: ${width}x${height} @ ${fps}fps`, "system-msg");
        }

        async function createInitialStream() {
            try {
                return await navigator.mediaDevices.getUserMedia({
                    audio: getAudioConstraints(),
                    video: getHighVideoConstraints(currentFacingMode)
                });
            } catch (err) {
                addLog("Sistem", "Mode kamera HD ketat gagal, mencoba mode kompatibel...", "system-msg");
                return navigator.mediaDevices.getUserMedia({
                    audio: getAudioConstraints(),
                    video: getFallbackVideoConstraints(currentFacingMode)
                });
            }
        }

        function setupPeerConnection(stream) {
            pc = new RTCPeerConnection();
            const audioTrack = stream.getAudioTracks()[0];
            const videoTrack = stream.getVideoTracks()[0];
            audioSender = pc.addTrack(audioTrack, stream);
            videoSender = pc.addTrack(videoTrack, stream);
        }

        async function negotiateWebRTC() {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            const response = await fetch('/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sdp: pc.localDescription.sdp,
                    type: pc.localDescription.type
                })
            });

            const answer = await response.json();
            await pc.setRemoteDescription(answer);
        }

        function canToggleTorch(videoTrack) {
            if (!videoTrack || typeof videoTrack.getCapabilities !== "function") return false;
            const capabilities = videoTrack.getCapabilities();
            return Boolean(capabilities && capabilities.torch);
        }

        async function switchCamera() {
            if (!videoSender) return;
            try {
                currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";

                let newVideoStream;
                try {
                    newVideoStream = await navigator.mediaDevices.getUserMedia({
                        video: getHighVideoConstraints(currentFacingMode)
                    });
                } catch (err) {
                    addLog("Sistem", "Mode kamera HD ketat gagal saat ganti kamera, pakai mode kompatibel.", "system-msg");
                    newVideoStream = await navigator.mediaDevices.getUserMedia({
                        video: getFallbackVideoConstraints(currentFacingMode)
                    });
                }
                const newVideoTrack = newVideoStream.getVideoTracks()[0];
                const oldVideoTrack = localStream.getVideoTracks()[0];

                await videoSender.replaceTrack(newVideoTrack);
                if (oldVideoTrack) oldVideoTrack.stop();
                if (oldVideoTrack) localStream.removeTrack(oldVideoTrack);
                localStream.addTrack(newVideoTrack);
                localVideo.srcObject = localStream;

                torchEnabled = false;
                updateTorchButtonState();
                torchBtn.disabled = !canToggleTorch(newVideoTrack);
                logVideoSettings(newVideoTrack, "Resolusi kamera aktif");
                addLog("Sistem", `Kamera aktif: ${currentFacingMode === "environment" ? "belakang" : "depan"}.`, "system-msg");
            } catch (err) {
                addLog("Error", "Gagal ganti kamera: " + err.message, "system-msg");
            }
        }

        async function toggleTorch() {
            try {
                const videoTrack = localStream && localStream.getVideoTracks()[0];
                if (!videoTrack) {
                    addLog("Error", "Track video tidak ditemukan.", "system-msg");
                    return;
                }
                if (!canToggleTorch(videoTrack)) {
                    addLog("Sistem", "Perangkat/browser ini tidak mendukung flashlight.", "system-msg");
                    return;
                }

                torchEnabled = !torchEnabled;
                await videoTrack.applyConstraints({ advanced: [{ torch: torchEnabled }] });
                updateTorchButtonState();
                addLog("Sistem", `Flashlight ${torchEnabled ? "diaktifkan" : "dimatikan"}.`, "system-msg");
            } catch (err) {
                torchEnabled = false;
                updateTorchButtonState();
                addLog("Error", "Gagal toggle flashlight: " + err.message, "system-msg");
            }
        }

        // --- TOUCH EVENTS (mobile-first) ---
        document.addEventListener('touchstart', (e) => {
            markUserInteraction();
            if (e.target.tagName === 'BUTTON') return;
            e.preventDefault();
            startHolding();
        }, { passive: false });

        document.addEventListener('touchend', () => {
            if (isHolding) stopHolding();
        });

        document.addEventListener('touchcancel', () => {
            if (isHolding) stopHolding();
        });

        // --- POINTER EVENTS (fallback desktop) ---
        document.addEventListener('pointerdown', (e) => {
            markUserInteraction();
            if (e.target.tagName === 'BUTTON') return;
            if (!isHolding) startHolding();
        });

        document.addEventListener('pointerup', () => {
            if (isHolding) stopHolding();
        });

        // Safety: stop mic jika halaman disembunyikan (pindah app, tutup tab)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isHolding) {
                stopHolding();
            }
        });

        async function start() {
            addLog("Sistem", "Meminta izin kamera & mic...", "system-msg");
            switchCameraBtn.disabled = true;
            torchBtn.disabled = true;
            updateTorchButtonState();
            try {
                localStream = await createInitialStream();
                localVideo.srcObject = localStream;
                const initialVideoTrack = localStream.getVideoTracks()[0];
                if (initialVideoTrack) {
                    initialVideoTrack.contentHint = "detail";
                    logVideoSettings(initialVideoTrack, "Resolusi awal");
                }

                setMicEnabled(false);

                setupPeerConnection(localStream);
                await negotiateWebRTC();

                switchCameraBtn.disabled = false;
                const videoTrack = localStream.getVideoTracks()[0];
                torchBtn.disabled = !canToggleTorch(videoTrack);
                addLog("Sistem", "Koneksi WebRTC Berhasil!", "system-msg");

                fetch('/trigger_tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: "Letakkan remote di depan kamera untuk pemetaan layout. Tunggu sampai layout siap, lalu tekan dan tahan layar untuk berbicara." })
                }).catch(err => {
                    addLog("Error", "Gagal kirim TTS awal: " + err.message, "system-msg");
                });
            } catch (err) {
                addLog("Error", "Gagal akses kamera/mic: " + err.message, "system-msg");
            }
        }

        switchCameraBtn.addEventListener("click", switchCamera);
        torchBtn.addEventListener("click", toggleTorch);

        window.onload = start;
    </script>
</body>

</html>
